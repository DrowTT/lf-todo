appId: com.lf.todo
productName: 极简待办
directories:
  buildResources: build
asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/better-sqlite3/**'
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/tray-icon.png
    to: tray-icon.png
files:
  - out/**/*
  - package.json
win:
  executableName: lf-todo
  target:
    - nsis
  icon: build/icon.png
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  language: 2052
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSBluetoothAlwaysUsageDescription: 极简待办不需要访问蓝牙；若系统提示此权限，可选择不允许。
    NSBluetoothPeripheralUsageDescription: 极简待办不需要访问蓝牙；若系统提示此权限，可选择不允许。
    NSCameraUsageDescription: 极简待办不需要访问摄像头；若系统提示此权限，可选择不允许。
    NSDocumentsFolderUsageDescription: 极简待办需要在导入或导出备份时访问你选择的文稿文件。
    NSDownloadsFolderUsageDescription: 极简待办需要在导入或导出备份时访问你选择的下载文件。
    NSMicrophoneUsageDescription: 极简待办不需要访问麦克风；若系统提示此权限，可选择不允许。
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
buildDependenciesFromSource: true
publish:
  provider: github
  owner: DrowTT
  repo: lf-todo
